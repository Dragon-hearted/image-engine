# systems/image-engine/knowledge/usage.yaml
# Authored by recon-image-engine. Schema: specs/rewrite-all-readmes-via-readme-engine.md Appendix A.
# ImageEngine is an HTTP service (Hono on Bun) — there is no CLI. All interaction is via REST.

features:
  - name: "Single image generation"
    description: "POST /api/generate turns a text prompt into an image via WisGate, persists it to disk + SQLite, and returns the generation record with token usage."
  - name: "Batch generation with dependency graph"
    description: "POST /api/generate/batch runs many prompts at once. A Kahn topological sort orders items by an optional sceneId dependency graph into layers; each layer runs concurrently (semaphore, max 5). Partial failures are captured per-item as {error} rather than failing the whole batch; circular deps are handled gracefully."
  - name: "Multi-provider model routing"
    description: "One endpoint, three providers. Higgsfield (higgsfield-nano-banana-pro — the DEFAULT) shells out to the local `higgsfield` CLI; the default CLI model is NanoBanana Pro (job_set_type nano_banana_2), with higgsfield-gpt-image-2 (-> gpt_image_2) also selectable and HIGGSFIELD_MODEL overriding the CLI token. Gemini models (gemini-3-pro-image-preview, gemini-3.1-flash-image-preview, gemini-2.5-flash-image) call WisGate's generateContent API; OpenAI models (gpt-image-2, gpt-image-1.5) route to WisGate's OpenAI-compatible /v1/images/generations. Selection is automatic: omit `model` (or pass one starting with 'higgsfield') for Higgsfield, names starting with 'gpt-' use the OpenAI path, everything else is Gemini. Gemini/OpenAI share one WISDOM_GATE_KEY."
  - name: "Permission-gated fallback (no silent provider swap)"
    description: "When the default Higgsfield provider fails (auth/timeout/CLI/no-URL), ImageEngine does NOT silently swap providers; it surfaces a clear actionable error. Auto-fallback to gemini-2.5-flash-image happens only when permitted per-request (autoFallback: true) or globally (IMAGE_ENGINE_AUTO_FALLBACK=1); the gallery/ledger then record the provider actually served."
  - name: "Reference images (image-to-image)"
    description: "Supply references two ways: inline base64 via referenceImages[] (each capped ~10 MB binary / 14M base64 chars) or referenceImageIds[] that are resolved against the IMAGES table via getImage() (NOT the generations table). Up to 14 references per request (6 objects + 5 humans per WisGate). Gemini path only; ignored for OpenAI models."
  - name: "Multi-turn conversational editing"
    description: "conversationHistory[] (Gemini role/parts content) lets you iteratively refine an image across turns. Gemini path only."
  - name: "Generation controls"
    description: "aspectRatio (14 ratios: 1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9, plus 1:4/1:8/4:1/8:1 on flash), imageSize (0.5K/1K/2K/4K), forceImage (image-only output), systemInstruction (style guidance), and openaiQuality (low/medium/high, default high) for OpenAI models."
  - name: "Rate limiting"
    description: "Token-bucket limiter on /api/generate* — default 10 requests/minute (IMAGE_ENGINE_RATE_LIMIT), 60s window, refilled proportionally. Over-limit requests get HTTP 429 with a Retry-After header; every response carries X-RateLimit-Limit / X-RateLimit-Remaining. State is a single in-memory bucket per process (resets on restart; not per-IP)."
  - name: "Budget guard + token ledger"
    description: "Two-layer cost control. (1) Dollar guard middleware on /api/generate*: hard-stops with HTTP 402 when the synced WisGate balance is exhausted, sets X-Budget-Warning past warnAtPercent (default 80%) and X-Budget-Spent/Remaining headers; bypass with header X-Budget-Override: true. (2) Token ceiling (IMAGE_ENGINE_TOKEN_CEILING, default 100000) enforced inside the batch executor against a SQLite token_ledger summing every generation's totalTokenCount."
  - name: "Startup balance sync"
    description: "On boot the server calls WisGate's balance API and records dollarTopUp (highest balance ever seen) and dollarsLastSeen into budget_config, logging 'Budget synced: $spent / $topUp'. Best-effort — failures are logged and ignored."
  - name: "Generation gallery"
    description: "Browse and reuse past work: GET /api/gallery (paginated, limit capped at 100), GET /api/gallery/:id (record), GET /api/gallery/:id/image (raw bytes, cached 24h), POST /api/gallery/:id/use-as-reference (returns the image as base64 to feed back as a reference)."
  - name: "Budget API"
    description: "GET /api/budget (status: token + dollar ceilings/spend/remaining; ?wisgate=true to include live balance), PUT /api/budget/ceiling (update token ceiling), GET /api/budget/history (token_ledger, optional from/to), GET /api/budget/wisgate-balance (live balance)."
  - name: "Retry with exponential backoff"
    description: "Both providers retry up to 3 times on 429/5xx with exponential backoff (2s/4s/8s); 400 and 401 fail fast with no retry. Gemini SAFETY finishReason surfaces a clear 'blocked by safety filters' error."
  - name: "Local persistence"
    description: "SQLite (Bun built-in, WAL mode) at ./imageengine.db with tables generations, images, token_ledger, budget_config; generated image bytes written to ./uploads/<uuid>.(png|jpg)."
  - name: "Health check"
    description: "GET /health returns 200 'ImageEngine API' — no key required, suitable for liveness probes."

prerequisites:
  - "Bun v1.0+ — curl -fsSL https://bun.sh/install | bash"
  - "Higgsfield CLI (HOST prerequisite for the default provider) — npm install -g @higgsfield/cli, then authenticate once with `higgsfield auth login`. The default model higgsfield-nano-banana-pro (CLI job_set_type nano_banana_2) shells out to this binary, so the default /api/generate path requires a working, authenticated CLI; without it (or its auth) Higgsfield generations fail with a clear actionable error rather than silently swapping providers (unless auto-fallback is enabled — see IMAGE_ENGINE_AUTO_FALLBACK / per-request autoFallback). Override the binary path with HIGGSFIELD_BIN, or the CLI model with HIGGSFIELD_MODEL, if needed."
  - "A WisGate (JuheAPI) account key set as WISDOM_GATE_KEY in systems/image-engine/.env (re-read from .env on every call, so rotating it needs no restart) — required for the Gemini/OpenAI models and the opt-in Higgsfield -> gemini fallback"
  - "For real Gemini/OpenAI generation (and the opt-in Higgsfield fallback): a positive WisGate dollar balance — when the balance is exhausted the budget guard hard-stops generation with HTTP 402"

configVars:
  - name: "WISDOM_GATE_KEY"
    required: true
    description: "WisGate API key for both the Gemini (x-goog-api-key) and OpenAI-compatible (Bearer) endpoints. Read from .env (not process.env) on every call. No default — generation throws 'WISDOM_GATE_KEY missing in .env' without it."
  - name: "IMAGE_ENGINE_PORT"
    required: false
    description: "HTTP server port. Default 3002."
  - name: "IMAGE_ENGINE_RATE_LIMIT"
    required: false
    description: "Rate-limiter token-bucket capacity = requests per minute on /api/generate*. Default 10."
  - name: "IMAGE_ENGINE_TOKEN_CEILING"
    required: false
    description: "Initial token budget ceiling seeded into budget_config on first run; enforced by the batch executor. Default 100000. Adjust later via PUT /api/budget/ceiling."
  - name: "HIGGSFIELD_BIN"
    required: false
    description: "Path to the higgsfield CLI binary. Resolved at call time. Default 'higgsfield' (on PATH)."
  - name: "HIGGSFIELD_MODEL"
    required: false
    description: "Overrides the default Higgsfield CLI model (job_set_type). Default 'nano_banana_2' (NanoBanana Pro). Resolved at call time. An explicit known public model id (higgsfield-gpt-image-2 -> gpt_image_2) still wins over this."
  - name: "IMAGE_ENGINE_AUTO_FALLBACK"
    required: false
    description: "Set to '1' to globally permit the Higgsfield -> gemini-2.5-flash-image auto-fallback when Higgsfield fails. Default: unset = no auto-fallback (a Higgsfield failure surfaces a clear actionable error). Per-request `autoFallback: true` overrides this."

install:
  - "cd systems/image-engine"
  - "bun install"

usageSteps:
  - title: "Start the server"
    command: "cd systems/image-engine && bun src/index.ts   # or: just start  (watch mode: just dev)"
    expected: "Logs 'Budget synced: $<spent> / $<topUp>' then 'ImageEngine running on port 3002'. Requires WISDOM_GATE_KEY in .env for the startup balance sync (sync is best-effort and won't block boot)."
  - title: "Confirm the service is up"
    command: "curl -s localhost:3002/health"
    expected: "HTTP 200, body 'ImageEngine API'. (Verified.)"
  - title: "Browse the generation gallery"
    command: "curl -s 'localhost:3002/api/gallery?limit=5'"
    expected: "HTTP 200 JSON {data:[...generations], limit, offset}. (Verified — returns existing generations, e.g. gpt-image-2 records.)"
  - title: "Check budget status"
    command: "curl -s 'localhost:3002/api/budget?wisgate=true'"
    expected: "HTTP 200 JSON BudgetStatus {tokenCeiling, tokensSpent, tokensRemaining, percentUsed, dollarsCeiling, dollarsSpent, dollarsRemaining, currencySymbol, wisGateBalance?}. (Verified.)"
  - title: "Generate a single image (WisGate / Gemini)"
    command: "curl -s -X POST localhost:3002/api/generate -H 'content-type: application/json' -d '{\"prompt\":\"a red bicycle on a white studio backdrop\",\"model\":\"gemini-2.5-flash-image\",\"aspectRatio\":\"1:1\"}'"
    expected: "HTTP 201 GenerationResult {id, imageUrl:'/api/gallery/<id>/image', model, prompt, tokenUsage, createdAt}. Requires WISDOM_GATE_KEY AND a positive WisGate balance — NOT executed (the test environment's balance is exhausted, so the dollar budget guard returns HTTP 402 'Budget ceiling exceeded' before generation). Bypass for testing only with header 'X-Budget-Override: true'."
  - title: "Generate a single image (OpenAI-compatible)"
    command: "curl -s -X POST localhost:3002/api/generate -H 'content-type: application/json' -d '{\"prompt\":\"product photo of a sneaker\",\"model\":\"gpt-image-2\",\"aspectRatio\":\"16:9\",\"openaiQuality\":\"high\"}'"
    expected: "HTTP 201 GenerationResult. Routes to WisGate's /v1/images/generations; aspectRatio maps to a pixel size (1024x1024 / 1024x1536 / 1536x1024). Requires WISDOM_GATE_KEY + balance — NOT executed (credential/budget-gated)."
  - title: "Batch generate with a dependency graph"
    command: "curl -s -X POST localhost:3002/api/generate/batch -H 'content-type: application/json' -d '{\"items\":[{\"prompt\":\"establishing shot\",\"sceneId\":\"s1\"},{\"prompt\":\"close-up\",\"sceneId\":\"s2\"}],\"dependencies\":[{\"sceneId\":\"s2\",\"dependsOn\":[\"s1\"]}]}'"
    expected: "HTTP 200 BatchResult {results:{s1:..., s2:...}, totalTokens}. Per-item errors appear as {error} entries. Requires WISDOM_GATE_KEY + balance — NOT executed (credential/budget-gated)."
  - title: "Reuse a past generation as a reference"
    command: "curl -s -X POST localhost:3002/api/gallery/<generationId>/use-as-reference"
    expected: "HTTP 200 {generationId, data:<base64>, mimeType}. Feed `data` back into a new request's referenceImages[]. (Note: referenceImageIds[] in /api/generate resolves against the IMAGES table id, not the generation id.)"
  - title: "Raise the token ceiling"
    command: "curl -s -X PUT localhost:3002/api/budget/ceiling -H 'content-type: application/json' -d '{\"ceiling\":250000}'"
    expected: "HTTP 200 updated BudgetStatus. Rejects non-numbers / negatives with HTTP 400."

commandsReference:
  - command: "bun src/index.ts   (alias: just start)"
    description: "Run the HTTP server (port IMAGE_ENGINE_PORT, default 3002)."
  - command: "bun --watch src/index.ts   (alias: just dev)"
    description: "Run the server with hot reload for development."
  - command: "bunx tsc --noEmit   (alias: just typecheck)"
    description: "Type-check the project."
  - command: "bunx @biomejs/biome check .   (alias: just lint)"
    description: "Lint and format check."
  - command: "bun test"
    description: "Run tests (test/inline-references.test.ts)."
  - command: "GET /health"
    description: "Liveness check; returns 'ImageEngine API'. No key required."
  - command: "POST /api/generate"
    description: "Single generation. Body GenerationRequest {prompt(req), model?, aspectRatio?, imageSize?, forceImage?, systemInstruction?, conversationHistory?, referenceImages?, referenceImageIds?, sceneId?, openaiQuality?}. 201 result; 400 missing prompt; 402 budget exceeded; 404 reference image id not found; 413 reference image too large; 500 provider error. Behind rate limiter + budget guard."
  - command: "POST /api/generate/batch"
    description: "Batch generation. Body BatchRequest {items:GenerationRequest[], dependencies?:[{sceneId,dependsOn[]}]}. 200 BatchResult {results, totalTokens}; 400 empty items. Concurrency 5; per-item failures captured."
  - command: "GET /api/gallery?limit=&offset="
    description: "Paginated list of generations (limit default 20, capped at 100; offset default 0)."
  - command: "GET /api/gallery/:id"
    description: "Single generation record; 404 if missing."
  - command: "GET /api/gallery/:id/image"
    description: "Raw image bytes (Content-Type png/jpeg, Cache-Control 24h); 404 if record or file missing."
  - command: "POST /api/gallery/:id/use-as-reference"
    description: "Returns {generationId, data(base64), mimeType} to reuse as a reference image."
  - command: "GET /api/budget?wisgate=true"
    description: "Budget status (token + dollar). ?wisgate=true attaches live WisGate balance (best-effort)."
  - command: "PUT /api/budget/ceiling"
    description: "Update token ceiling. Body {ceiling:number>=0}; 400 if invalid."
  - command: "GET /api/budget/history?from=&to="
    description: "Token usage ledger, optional ISO date range."
  - command: "GET /api/budget/wisgate-balance"
    description: "Live WisGate account balance."
